x-build-platforms: ${BUILD_PLATFORMS:-linux/amd64,linux/arm64}

services:
  database:
    image: ${DATABASE_IMAGE:-timescale/timescaledb:latest-pg17}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or Portainer}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - type: bind
        source: ${TRACCAR_VOLUME_ROOT:-/home/zeeshan/containers/volumes/traccar}/database
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar -d traccar"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traccar:
    image: ${TRACCAR_IMAGE:-traccar/traccar:6.17.0-alpine}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or Portainer}
      PROTOCOLS_ENABLE: osmand
      OSMAND_PORT: "5055"
      OSMAND_SPEED: knots
      FILTER_DUPLICATE: "true"
      LOGGER_CONSOLE: "true"
      WEB_URL: https://${TRACCAR_DOMAIN:-traccar.zeeit.dev}
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.traccar.rule: Host(`${TRACCAR_DOMAIN:-traccar.zeeit.dev}`)
      traefik.http.routers.traccar.entrypoints: websecure
      traefik.http.routers.traccar.tls: "true"
      traefik.http.routers.traccar.tls.certresolver: cloudflare
      traefik.http.routers.traccar.middlewares: authentik@file
      traefik.http.routers.traccar.service: traccar
      traefik.http.services.traccar.loadbalancer.server.port: "8082"
      traefik.http.services.traccar.loadbalancer.server.scheme: http
    volumes:
      - type: bind
        source: ${TRACCAR_VOLUME_ROOT:-/home/zeeshan/containers/volumes/traccar}/logs
        target: /opt/traccar/logs
        bind:
          create_host_path: false
      - type: bind
        source: ${TRACCAR_VOLUME_ROOT:-/home/zeeshan/containers/volumes/traccar}/data
        target: /opt/traccar/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    logging: *logging

  connexis-adapter:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/${ADAPTER_IMAGE_NAME:-traccar-connexis-adapter}:${ADAPTER_IMAGE_TAG:-1.0.0}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      traccar:
        condition: service_healthy
    environment:
      CONNEXIS_BASE_URL: ${CONNEXIS_BASE_URL:?Set CONNEXIS_BASE_URL}
      CONNEXIS_API_TOKEN: ${CONNEXIS_API_TOKEN:?Set CONNEXIS_API_TOKEN}
      CONNEXIS_ASSETS_PATH: ${CONNEXIS_ASSETS_PATH:-/api/v1/assets/}
      CONNEXIS_LOCATIONS_PATH: ${CONNEXIS_LOCATIONS_PATH:-/api/v1/current_location}
      CONNEXIS_PLATES: ${CONNEXIS_PLATES:-}
      CONNEXIS_REQUESTS_PER_MINUTE: ${CONNEXIS_REQUESTS_PER_MINUTE:-3}
      TRACCAR_URL: http://traccar:5055
      POLL_INTERVAL: ${POLL_INTERVAL:-15}
      MAX_BACKOFF: ${MAX_BACKOFF:-300}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-20}
      GPS_UTC_OFFSET: ${GPS_UTC_OFFSET:-+05:00}
      SPEED_UNIT: ${SPEED_UNIT:-kmh}
      VERIFY_TLS: ${VERIFY_TLS:-true}
      STATE_PATH: /data/state.sqlite3
      HEALTH_PATH: /tmp/adapter-health
      HEALTH_MAX_AGE: ${HEALTH_MAX_AGE:-600}
    volumes:
      - type: bind
        source: ${TRACCAR_VOLUME_ROOT:-/home/zeeshan/containers/volumes/traccar}/adapter-state
        target: /data
        bind:
          create_host_path: false
    labels:
      traefik.enable: "false"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "adapter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging: *logging

networks:
  traefik-public:
    external: true
