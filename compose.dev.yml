# Local development: named volumes and a localhost dashboard, without Traefik.
# Run: docker compose -p traccar-dev -f compose.dev.yml up --build -d
services:
  database:
    image: ${DATABASE_IMAGE:-timescale/timescaledb:latest-pg17}
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or Portainer}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - traccar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar -d traccar"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traccar:
    image: ${TRACCAR_IMAGE:-traccar/traccar:6.17.0-alpine}
    pull_policy: missing
    restart: unless-stopped
    # Keep this startup guard identical to production; blank keys must be absent.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$$MAIL_SMTP_HOST" ]; then
          unset MAIL_SMTP_HOST
        else
          : "$${MAIL_SMTP_FROM:?Set SMTP_FROM when SMTP_HOST is set}"
          if [ "$$MAIL_SMTP_SSL_ENABLE" = true ] && [ "$$MAIL_SMTP_STARTTLS_ENABLE" = true ]; then
            echo 'Choose SMTP_STARTTLS=true or SMTP_SSL=true, not both.' >&2
            exit 1
          fi
        fi
        if [ -z "$$OPENID_CLIENT_ID" ]; then
          if [ "$$OPENID_FORCE" = true ]; then
            echo 'OPENID_FORCE=true requires a configured OPENID_CLIENT_ID.' >&2
            exit 1
          fi
          unset OPENID_CLIENT_ID OPENID_CLIENT_SECRET OPENID_ISSUER_URL
        else
          : "$${OPENID_CLIENT_SECRET:?Set OPENID_CLIENT_SECRET when OPENID_CLIENT_ID is set}"
          : "$${OPENID_ISSUER_URL:?Set OPENID_ISSUER_URL when OPENID_CLIENT_ID is set}"
        fi
        exec /opt/traccar/jre/bin/java -XX:+ExitOnOutOfMemoryError "$$@"
      - traccar-start
    command: ["-jar", "tracker-server.jar", "conf/traccar.xml"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or Portainer}
      PROTOCOLS_ENABLE: osmand
      OSMAND_PORT: "5055"
      OSMAND_SPEED: knots
      FILTER_DUPLICATE: "true"
      LOGGER_CONSOLE: "true"
      WEB_URL: http://localhost:${TRACCAR_WEB_PORT:-8082}
      MAIL_SMTP_HOST: ${SMTP_HOST:-}
      MAIL_SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_SMTP_FROM: ${SMTP_FROM:-}
      MAIL_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Traccar}
      MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-true}
      MAIL_SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS:-true}
      MAIL_SMTP_SSL_ENABLE: ${SMTP_SSL:-false}
      MAIL_SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10000}
      MAIL_SMTP_SYSTEM_ONLY: "false"
      OPENID_CLIENT_ID: ${OPENID_CLIENT_ID:-}
      OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET:-}
      OPENID_ISSUER_URL: ${OPENID_ISSUER_URL:-}
      OPENID_FORCE: ${OPENID_FORCE:-false}
      OPENID_ALLOW_REGISTRATION: ${OPENID_ALLOW_REGISTRATION:-false}
      OPENID_ALLOW_GROUP: ${OPENID_ALLOW_GROUP:-}
      OPENID_ADMIN_GROUP: ${OPENID_ADMIN_GROUP:-}
    ports:
      - "${TRACCAR_BIND_ADDRESS:-127.0.0.1}:${TRACCAR_WEB_PORT:-8082}:8082"
    expose:
      - "5055"
    volumes:
      - traccar_logs:/opt/traccar/logs
      - traccar_data:/opt/traccar/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    logging: *logging

  connexis-adapter:
    image: traccar-connexis-adapter:dev
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      traccar:
        condition: service_healthy
    environment:
      CONNEXIS_BASE_URL: ${CONNEXIS_BASE_URL:?Set CONNEXIS_BASE_URL}
      CONNEXIS_API_TOKEN: ${CONNEXIS_API_TOKEN:?Set CONNEXIS_API_TOKEN}
      CONNEXIS_ASSETS_PATH: ${CONNEXIS_ASSETS_PATH:-/api/v1/assets/}
      CONNEXIS_LOCATIONS_PATH: ${CONNEXIS_LOCATIONS_PATH:-/api/v1/current_location}
      CONNEXIS_PLATES: ${CONNEXIS_PLATES:-}
      CONNEXIS_REQUESTS_PER_MINUTE: ${CONNEXIS_REQUESTS_PER_MINUTE:-3}
      TRACCAR_URL: http://traccar:5055
      MAX_BACKOFF: ${MAX_BACKOFF:-300}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-20}
      GPS_UTC_OFFSET: ${GPS_UTC_OFFSET:-+05:00}
      SPEED_UNIT: ${SPEED_UNIT:-kmh}
      VERIFY_TLS: ${VERIFY_TLS:-true}
      STATE_PATH: /data/state.sqlite3
      HEALTH_PATH: /tmp/adapter-health
      HEALTH_MAX_AGE: ${HEALTH_MAX_AGE:-600}
    volumes:
      - adapter_state:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "adapter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging: *logging

volumes:
  traccar_db:
  traccar_logs:
  traccar_data:
  adapter_state:
